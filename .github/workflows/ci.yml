name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Package Cloudflare Pages ZIP
        run: cd out && zip -r ../elara-cloudflare-pages.zip .
      - name: Upload Cloudflare Pages ZIP
        uses: actions/upload-artifact@v4
        with:
          name: elara-cloudflare-pages
          path: elara-cloudflare-pages.zip
          if-no-files-found: error
          retention-days: 14
