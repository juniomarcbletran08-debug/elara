name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: write
  actions: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile on the development branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              -d "{\"ref\":\"\${GITHUB_REF_NAME}\"}"
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a=require(process.argv[1]); for(const [name,v] of Object.entries(a.vulnerabilities||{})){const via=(v.via||[]).map(x=>typeof x==="string"?x:x.title).join("; "); console.log(name+" | severity="+v.severity+" | direct="+v.isDirect+" | fixAvailable="+JSON.stringify(v.fixAvailable)+" | via="+via)}' "$RUNNER_TEMP/npm-audit.json"
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
