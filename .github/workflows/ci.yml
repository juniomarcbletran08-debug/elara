name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a=require(process.argv[1]); for(const [name,v] of Object.entries(a.vulnerabilities||{})){const via=(v.via||[]).map(x=>typeof x==="string"?x:x.title).join("; "); console.log(name+" | severity="+v.severity+" | direct="+v.isDirect+" | fixAvailable="+JSON.stringify(v.fixAvailable)+" | via="+via)}' "$RUNNER_TEMP/npm-audit.json"
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
